<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Banco · Questões de Hanseníase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;padding-block:24px 8px}
.head h1{margin:0;font-size:clamp(1.6rem,4vw,2.2rem)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;padding-block:16px 48px;align-items:start}
.tabs{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;position:sticky;top:12px}
.tabs button{display:flex;justify-content:space-between;gap:8px;font:inherit;font-size:.92rem;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer}
.tabs button:hover{background:var(--bg)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.tabs button span{font-variant-numeric:tabular-nums;opacity:.75}
.tabs .grupo{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:10px 10px 2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.bar h2{margin:0;font-size:1.15rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bar .sp{flex:1}
#filtro{flex:1 1 200px;min-width:0}
.info{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tbl{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;font-size:.85rem;min-width:100%}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{position:sticky;top:0;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;color:var(--muted);z-index:1}
td{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem}
td.long{white-space:normal;min-width:260px;max-width:480px}
td .null{color:var(--muted);font-style:italic}
td .t{color:var(--ok);font-weight:700}td .f{color:var(--bad);font-weight:700}
tbody tr:hover{background:var(--accent-soft)}
.pag{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:.88rem}
.empty{padding:30px 0;text-align:center;color:var(--muted)}
@media (max-width:760px){.layout{grid-template-columns:1fr}.tabs{position:static;flex-direction:row;flex-wrap:wrap}.tabs .grupo{display:none}}
</style>
</head>
<body>
<nav class="topnav wrap wide">
  <strong style="font-family:var(--f-display)">Hanseníase · Painel</strong>
  <a href="/admin">Questões</a>
  <a href="/dashboard">Dashboard</a>
  <a href="/admin/banco" aria-current="page">Banco</a>
  <a href="/" target="_blank" rel="noopener">Ver página pública</a>
</nav>

<main class="wrap wide">
  <div class="head">
    <div><div class="eyebrow">Somente leitura</div><h1>Banco de dados</h1></div>
    <button class="btn ghost" id="atualizar" type="button">Atualizar</button>
  </div>
  <div id="erro" class="alert" hidden></div>
  <div class="layout">
    <aside class="tabs" id="tabs" aria-label="Tabelas"></aside>
    <section class="panel">
      <div class="bar">
        <h2 id="nome">–</h2><span class="info" id="info"></span><span class="sp"></span>
        <input id="filtro" type="search" placeholder="Filtrar nesta página…" aria-label="Filtrar linhas">
        <select id="limite" aria-label="Linhas por página"><option>50</option><option selected>100</option><option>500</option><option>1000</option></select>
        <button class="btn ghost" id="csv" type="button">Baixar CSV</button>
      </div>
      <div class="tbl" id="tbl"><p class="empty">Carregando…</p></div>
      <div class="pag"><button class="btn ghost" id="ant" type="button">← Anterior</button><span id="pg" class="info"></span><button class="btn ghost" id="prox" type="button">Próxima →</button></div>
    </section>
  </div>
</main>

<script>
const token = sessionStorage.getItem("hq-token");
if(!token) location.href = "/admin";
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GRUPOS = {"Conteúdo":["questoes"], "Respostas":["respostas"],
  "Jogo":["trilhas","missoes","missao_etapas","jogadores","progresso_missoes","insignias_jogador"], "Acesso":["usuarios"]};
const st = {tabelas:[], atual:new URLSearchParams(location.search).get("t")||"questoes", pagina:1, dados:null};

async function get(path){
  const r = await fetch(path,{headers:{Authorization:`Bearer ${token}`}});
  if(r.status===401){ location.href="/admin"; throw 0; }
  if(!r.ok) throw new Error("Não foi possível carregar os dados.");
  return r;
}
function mostraErro(e){ const el=$("#erro"); el.textContent=e.message||"Erro inesperado."; el.hidden=false; }

async function carregaTabelas(){
  st.tabelas = await (await get("/api/admin/banco")).json();
  const cont = Object.fromEntries(st.tabelas.map(t=>[t.tabela,t.linhas]));
  $("#tabs").innerHTML = Object.entries(GRUPOS).map(([g,ts])=>`<div class="grupo">${g}</div>` +
    ts.filter(t=>t in cont).map(t=>`<button type="button" data-t="${t}" aria-pressed="${t===st.atual}">${t}<span>${cont[t].toLocaleString("pt-BR")}</span></button>`).join("")).join("");
}

function celula(v){
  if(v===null||v===undefined) return '<span class="null">null</span>';
  if(v===true) return '<span class="t">true</span>';
  if(v===false) return '<span class="f">false</span>';
  if(typeof v==="object") return esc(JSON.stringify(v));
  return esc(v);
}

function desenha(){
  const d = st.dados; if(!d) return;
  const f = $("#filtro").value.trim().toLowerCase();
  const linhas = f ? d.linhas.filter(r=>r.some(v=>v!=null && String(typeof v==="object"?JSON.stringify(v):v).toLowerCase().includes(f))) : d.linhas;
  const longas = new Set(d.colunas.map((c,i)=>d.linhas.some(r=>String(typeof r[i]==="object"?JSON.stringify(r[i]):r[i]??"").length>60)?i:-1).filter(i=>i>=0));
  $("#tbl").innerHTML = linhas.length
    ? `<table><thead><tr>${d.colunas.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
        linhas.map(r=>`<tr>${r.map((v,i)=>`<td${longas.has(i)?' class="long"':""}>${celula(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`
    : `<p class="empty">${d.total? "Nenhuma linha bate com o filtro nesta página." : "Tabela vazia."}</p>`;
  const paginas = Math.max(1, Math.ceil(d.total/d.limite));
  $("#nome").textContent = d.tabela;
  $("#info").textContent = `${d.total.toLocaleString("pt-BR")} linhas · ${d.colunas.length} colunas · mais recentes primeiro`;
  $("#pg").textContent = `Página ${d.pagina} de ${paginas}`;
  $("#ant").disabled = d.pagina<=1; $("#prox").disabled = d.pagina>=paginas;
}

async function abre(t, pagina=1){
  st.atual = t; st.pagina = pagina;
  history.replaceState(null,"",`/admin/banco?t=${t}`);
  document.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.t===t));
  try{
    $("#erro").hidden = true;
    st.dados = await (await get(`/api/admin/banco/${t}?limite=${$("#limite").value}&pagina=${pagina}`)).json();
    desenha();
  }catch(e){ if(e) mostraErro(e); }
}

async function baixaCsv(){
  try{
    const blob = await (await get(`/api/admin/banco/${st.atual}/csv`)).blob();
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${st.atual}.csv`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }catch(e){ if(e) mostraErro(e); }
}

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-t]"); if(b){ $("#filtro").value=""; abre(b.dataset.t); }
});
$("#ant").onclick = ()=>abre(st.atual, st.pagina-1);
$("#prox").onclick = ()=>abre(st.atual, st.pagina+1);
$("#limite").onchange = ()=>abre(st.atual, 1);
$("#filtro").oninput = desenha;
$("#csv").onclick = baixaCsv;
$("#atualizar").onclick = async()=>{ await carregaTabelas(); abre(st.atual, st.pagina); };

(async()=>{
  try{ await carregaTabelas(); }catch(e){ if(e) mostraErro(e); return; }
  if(!st.tabelas.some(t=>t.tabela===st.atual)) st.atual = "questoes";
  abre(st.atual);
})();
</script>
</body>
</html>
