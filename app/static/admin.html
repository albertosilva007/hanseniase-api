<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin · Questões de Hanseníase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>
#login{max-width:400px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
#login h1{font-size:1.7rem;margin:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:20px 12px}
.tools input{flex:1 1 200px;min-width:0}
.list{display:flex;flex-direction:column;gap:8px;padding-bottom:48px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:start}
.item .id{font-family:var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.item .txt{min-width:0}
.item .txt p{margin:4px 0 0;font-weight:700;line-height:1.4}
.item .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.item.inativo{opacity:.65}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
dialog form{padding:22px;display:flex;flex-direction:column;gap:14px}
dialog h2{margin:0;font-size:1.3rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.optrow{display:flex;gap:8px;align-items:center}
.optrow input[type=text]{flex:1;min-width:0}
.optrow input[type=radio]{width:18px;height:18px;accent-color:var(--ok)}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.foot .sp{flex:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.item{grid-template-columns:1fr}.item .id{display:none}.item .acts{justify-content:flex-start}}
</style>
</head>
<body>

<section id="login" class="card wrap" hidden>
  <div class="eyebrow">Área da equipe</div>
  <h1>Entrar no painel</h1>
  <form id="fLogin" style="display:flex;flex-direction:column;gap:12px">
    <label>E-mail<input id="lEmail" type="email" autocomplete="username" required></label>
    <label>Senha<input id="lSenha" type="password" autocomplete="current-password" required></label>
    <div id="lErro" class="alert" hidden></div>
    <button class="btn" type="submit">Entrar</button>
  </form>
</section>

<div id="app" hidden>
  <nav class="topnav wrap wide">
    <strong style="font-family:var(--f-display)">Hanseníase · Painel</strong>
    <a href="/admin" aria-current="page">Questões</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/admin/banco">Banco</a>
    <a href="/" target="_blank" rel="noopener">Ver página pública</a>
    <span class="sp"></span>
    <span class="muted" id="who"></span>
    <button class="link" id="sair" type="button">Sair</button>
  </nav>
  <div class="wrap wide">
    <div class="tools">
      <select id="fPub" aria-label="Público"><option value="">Todos os públicos</option><option value="prof">Profissionais</option><option value="pac">Pacientes e comunidade</option></select>
      <select id="fAtivo" aria-label="Situação"><option value="">Ativas e inativas</option><option value="1">Só ativas</option><option value="0">Só inativas</option></select>
      <input id="fBusca" type="search" placeholder="Buscar no enunciado ou tema" aria-label="Buscar">
      <button class="btn" id="nova" type="button">Nova questão</button>
    </div>
    <p class="muted" id="resumo" style="margin:0 0 10px;font-size:.88rem"></p>
    <div class="list" id="lista"></div>
  </div>
</div>

<dialog id="dlg">
  <form id="fQ" method="dialog">
    <h2 id="dlgTit">Nova questão</h2>
    <div class="grid2">
      <label>Público
        <select id="qPub" required><option value="prof">Profissionais</option><option value="pac">Pacientes e comunidade</option></select>
      </label>
      <label>Tema<input id="qTema" list="temas" required maxlength="80"><datalist id="temas"></datalist></label>
    </div>
    <label>Enunciado<textarea id="qEnun" required minlength="5"></textarea></label>
    <div>
      <label style="margin-bottom:6px">Alternativas</label>
      <p class="hint" style="margin-bottom:8px">Marque o círculo da alternativa correta. Entre 2 e 6 alternativas.</p>
      <div id="opts" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="link" type="button" id="addOpt" style="margin-top:8px">+ Adicionar alternativa</button>
    </div>
    <label>Comentário do gabarito<textarea id="qExp"></textarea></label>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input id="qAtivo" type="checkbox" checked style="width:18px;height:18px"> Questão visível na página pública</label>
    <div id="qErro" class="alert" hidden></div>
    <div class="foot">
      <span class="sp"></span>
      <button class="btn ghost" type="button" id="cancelar">Cancelar</button>
      <button class="btn" type="submit" id="salvar">Salvar</button>
    </div>
  </form>
</dialog>

<script>
const AUD = {prof:"Profissionais", pac:"Pacientes e comunidade"};
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let token = sessionStorage.getItem("hq-token"), todas = [], editId = null, confirmId = null;

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.append(t); setTimeout(()=>t.remove(),2200); }

async function api(path, opt={}){
  const r = await fetch(path, {...opt, headers:{"Content-Type":"application/json", ...(token?{Authorization:`Bearer ${token}`}:{}), ...(opt.headers||{})}});
  if(r.status===401 && path!=="/api/auth/login"){ sair(); throw new Error("Sessão expirada. Entre de novo."); }
  if(!r.ok){ let d; try{ d=(await r.json()).detail }catch(e){} throw new Error(Array.isArray(d) ? d.map(x=>x.msg.replace(/^Value error, /,"")).join("; ") : (d||"Erro inesperado")); }
  return r.status===204 ? null : r.json();
}

function sair(){ token=null; sessionStorage.removeItem("hq-token"); $("#app").hidden=true; $("#login").hidden=false; }

async function iniciar(){
  if(!token){ sair(); return; }
  try{ const me = await api("/api/admin/me"); $("#who").textContent = me.email; $("#login").hidden=true; $("#app").hidden=false; await carregar(); }
  catch(e){ sair(); }
}

$("#fLogin").addEventListener("submit", async e=>{
  e.preventDefault(); $("#lErro").hidden=true;
  try{ const t = await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("#lEmail").value,senha:$("#lSenha").value})});
    token=t.access_token; sessionStorage.setItem("hq-token",token); iniciar(); }
  catch(err){ $("#lErro").textContent=err.message; $("#lErro").hidden=false; }
});
$("#sair").onclick = sair;

async function carregar(){ todas = await api("/api/admin/questoes");
  $("#temas").innerHTML = [...new Set(todas.map(q=>q.tema))].sort().map(t=>`<option value="${esc(t)}">`).join("");
  render(); }

function render(){
  const pub=$("#fPub").value, at=$("#fAtivo").value, b=$("#fBusca").value.trim().toLowerCase();
  const v = todas.filter(q=>(!pub||q.publico===pub)&&(at===""||String(+q.ativo)===at)&&(!b||(q.enunciado+" "+q.tema).toLowerCase().includes(b)));
  const ativas = todas.filter(q=>q.ativo).length;
  $("#resumo").textContent = `${todas.length} questões cadastradas (${ativas} ativas). Mostrando ${v.length}.`;
  $("#lista").innerHTML = v.map(q=>`
    <div class="item${q.ativo?"":" inativo"}">
      <span class="id">#${q.id}</span>
      <div class="txt"><div class="chips"><span class="chip ${q.publico}">${AUD[q.publico]}</span>${q.ativo?"":'<span class="chip off">Inativa</span>'}<span>${esc(q.tema)}</span></div><p>${esc(q.enunciado)}</p></div>
      <div class="acts">${confirmId===q.id
        ? `<span class="confirm">Excluir também as respostas registradas? <button class="btn danger" data-del="${q.id}">Excluir</button><button class="btn ghost" data-nodel>Cancelar</button></span>`
        : `<button class="btn ghost" data-edit="${q.id}">Editar</button><button class="btn ghost" data-ask="${q.id}">Excluir</button>`}</div>
    </div>`).join("") || '<p class="muted">Nenhuma questão com esses filtros.</p>';
}
["#fPub","#fAtivo","#fBusca"].forEach(s=>$(s).addEventListener("input",render));

function optRow(txt="", checked=false){
  const i = $("#opts").children.length;
  const d=document.createElement("div"); d.className="optrow";
  d.innerHTML=`<input type="radio" name="correta" aria-label="Correta" ${checked?"checked":""}><input type="text" required value="${esc(txt)}" aria-label="Alternativa"><button type="button" class="link" data-rm>remover</button>`;
  $("#opts").append(d);
}
$("#addOpt").onclick=()=>{ if($("#opts").children.length<6) optRow(); else toast("Máximo de 6 alternativas"); };
$("#opts").addEventListener("click",e=>{ if(e.target.dataset.rm!==undefined){ if($("#opts").children.length>2) e.target.parentElement.remove(); else toast("Mínimo de 2 alternativas"); }});

function abrir(q){
  editId = q?.id ?? null;
  $("#dlgTit").textContent = q ? `Editar questão #${q.id}` : "Nova questão";
  $("#qPub").value=q?.publico||"prof"; $("#qTema").value=q?.tema||""; $("#qEnun").value=q?.enunciado||"";
  $("#qExp").value=q?.explicacao||""; $("#qAtivo").checked=q?q.ativo:true; $("#qErro").hidden=true;
  $("#opts").innerHTML=""; (q?.opcoes||["","","",""]).forEach((o,i)=>optRow(o, q?i===q.correta:i===0));
  $("#dlg").showModal();
}
$("#nova").onclick=()=>abrir(null);
$("#cancelar").onclick=()=>$("#dlg").close();

$("#fQ").addEventListener("submit", async e=>{
  e.preventDefault();
  const rows=[...$("#opts").children];
  const body={publico:$("#qPub").value, tema:$("#qTema").value.trim(), enunciado:$("#qEnun").value.trim(),
    opcoes:rows.map(r=>r.querySelector("input[type=text]").value.trim()),
    correta:rows.findIndex(r=>r.querySelector("input[type=radio]").checked), explicacao:$("#qExp").value.trim(), ativo:$("#qAtivo").checked};
  if(body.correta<0){ $("#qErro").textContent="Marque qual alternativa é a correta."; $("#qErro").hidden=false; return; }
  $("#salvar").disabled=true;
  try{ await api(editId?`/api/admin/questoes/${editId}`:"/api/admin/questoes",{method:editId?"PUT":"POST",body:JSON.stringify(body)});
    $("#dlg").close(); toast(editId?"Questão atualizada":"Questão criada"); await carregar(); }
  catch(err){ $("#qErro").textContent=err.message; $("#qErro").hidden=false; }
  finally{ $("#salvar").disabled=false; }
});

$("#lista").addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.edit){ abrir(todas.find(q=>q.id===+b.dataset.edit)); }
  else if(b.dataset.ask){ confirmId=+b.dataset.ask; render(); }
  else if(b.dataset.nodel!==undefined){ confirmId=null; render(); }
  else if(b.dataset.del){ try{ await api(`/api/admin/questoes/${b.dataset.del}`,{method:"DELETE"}); confirmId=null; toast("Questão excluída"); await carregar(); }catch(err){ toast(err.message); } }
});

iniciar();
</script>
</body>
</html>
