# Blueprint do Render: cria a API (Docker) e o PostgreSQL de uma vez.
# Render > New > Blueprint > selecione o repositório.
services:
  - type: web
    name: hanseniase-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hanseniase-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false        # o Render pede o valor na criação
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: SEED_ON_STARTUP
        value: "true"

databases:
  - name: hanseniase-db
    plan: free
    databaseName: hanseniase
    user: hanseniase
