services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hans
      POSTGRES_PASSWORD: hans
      POSTGRES_DB: hanseniase
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hans -d hanseniase"]
      interval: 5s
      retries: 10
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hans:hans@db:5432/hanseniase
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
